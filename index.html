<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Life Ledger</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0E1116">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  html,body{margin:0;padding:0;height:100%;background:#0E1116;overflow:hidden;
            font:14px/1.5 -apple-system,Roboto,system-ui,sans-serif;color:#8B949E}
  /* The app sits in a clipping box. The frame is taller than the box and pulled
     up by BANNER px, so Google's "created by another user" bar is cropped off
     the top. It lives in script.google.com's own document, cross-origin, so it
     cannot be hidden any other way. */
  #clip{position:fixed;inset:0;overflow:hidden}
  /* One pane per mode, stacked. All three stay loaded so switching is a
     visibility flip rather than a fresh page load. visibility:hidden (not
     display:none) keeps each pane laid out at the right size, and a hidden
     pane cannot receive taps. */
  .pane{position:absolute;left:0;width:100%;border:0;display:block;
        visibility:hidden;z-index:0}
  .pane.on{visibility:visible;z-index:1}
  #msg{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
       padding:28px;text-align:center}
  #msg code{color:#E8EAED;background:#161B22;border:1px solid #262D36;
            border-radius:6px;padding:2px 6px;font-size:13px}
  #msg h1{color:#E8EAED;font-size:17px;font-weight:600;margin:0 0 6px}
  #tok{width:100%;box-sizing:border-box;margin:16px 0 10px;padding:11px 12px;
       background:#0E1116;color:#E8EAED;border:1px solid #262D36;border-radius:8px;
       font:13px/1.3 ui-monospace,SFMono-Regular,Menlo,monospace;text-align:center}
  #tok:focus{outline:none;border-color:#4FC1B0}
  #go{width:100%;padding:11px;background:#4FC1B0;color:#0E1116;border:0;
      border-radius:8px;font:600 15px/1 -apple-system,Roboto,system-ui,sans-serif;
      -webkit-appearance:none}
  #err{color:#E8698F;font-size:12px;min-height:16px;margin:8px 0 0}
  /* !important on purpose: #msg is an ID selector that sets display:flex, which
     outranks a plain .hide class. Without this the "no token" overlay stays on
     top of the app, swallowing every tap. */
  .hide{display:none!important}
  /* Crop tuner. Only visible with ?tune=1, and it sits on top of the app so the
     effect of each tap is visible immediately. */
  #tune{position:fixed;left:8px;right:8px;bottom:8px;z-index:9;
        background:#161B22;border:1px solid #262D36;border-radius:10px;
        padding:8px;box-shadow:0 6px 24px rgba(0,0,0,.5)}
  #tunetip{color:#8B949E;font-size:12px;line-height:1.35;margin:2px 4px 8px;text-align:center}
  #tunetip b{color:#E8EAED;font-weight:600}
  #tunerow{display:flex;gap:6px;align-items:center}
  #tune button{flex:1;padding:10px 0;background:#1B2230;color:#E8EAED;border:1px solid #262D36;
               border-radius:8px;font:600 15px/1 -apple-system,Roboto,system-ui,sans-serif;
               -webkit-appearance:none}
  #tune #done{background:#4FC1B0;color:#0E1116;border-color:#4FC1B0}
  #tune span{flex:0 0 52px;text-align:center;color:#E8EAED;
             font:600 14px/1 ui-monospace,SFMono-Regular,Menlo,monospace}
</style>
</head>
<body>

<div id="clip" class="hide"></div>

<div id="tune" class="hide">
  <div id="tunetip">
    This trims the top of the screen to hide Google's grey banner.<br>
    Tap <b>−8</b> until the <b>LEDGER / STATUS / ADD</b> buttons appear at the very top,
    then <b>+2</b> until no grey strip is left above them.
  </div>
  <div id="tunerow">
    <button type="button" data-d="-8">−8</button>
    <button type="button" data-d="-2">−2</button>
    <span id="tval">46</span>
    <button type="button" data-d="2">+2</button>
    <button type="button" data-d="8">+8</button>
    <button type="button" id="done">Done</button>
  </div>
</div>

<div id="msg">
  <form id="form" style="width:100%;max-width:340px">
    <h1>Life Ledger</h1>
    <p style="margin:0">Paste your token once. This device remembers it.</p>
    <input id="tok" type="text" inputmode="text" autocomplete="off"
           autocapitalize="off" autocorrect="off" spellcheck="false"
           placeholder="token">
    <button id="go" type="submit">Open</button>
    <p id="err"></p>
  </form>
</div>

<script>
/* ---------------------------------------------------------------------------
   Life Ledger wrapper.

   Why this page exists: Apps Script puts a "created by another user" banner in
   the top-level document on script.google.com. The app runs in a cross-origin
   iframe below it and cannot touch it. Wrapping the app in a page WE own lets
   us crop the banner and, with the manifest, install it as a real standalone
   app rather than a browser tab.

   The token lives in the URL FRAGMENT. Fragments are never sent to a server,
   so this file can sit in a public repo with no secret in it.
--------------------------------------------------------------------------- */

/* Height of Google's banner, in CSS pixels. It is NOT the same on every device:
   phone and desktop differ, and Google changes it. So it is tunable at runtime
   (?tune=1) and the tuned value is stored, because the installed app launches
   start_url "./" with no parameters at all. */
var BANNER_DEFAULT = 46;
var BANNER = BANNER_DEFAULT;
/* Note the isFinite check: +null is 0, so a plain ">= 0" test on an unset key
   silently sets the crop to zero. */
var BANNER_SET = false;          // has this device ever been tuned?
try {
  var b = localStorage.getItem('llBanner');
  if (b !== null && isFinite(+b) && +b >= 0) { BANNER = +b; BANNER_SET = true; }
} catch (e) {}

var EXEC = 'https://script.google.com/macros/s/AKfycbz_t7yUQQfXqDWRy7PWJh-Ho9HbPSUMU2B0GyTqgj-DiXpDeVC7n1jV9JtQ7XADHgsa7A/exec';   // already set to your deployment

var clip  = document.getElementById('clip');
var hash  = {}, TOKEN = '';

/* One loaded pane per mode. The wrapper, not the server, decides which mode
   opens: a preload would otherwise overwrite the server's remembered mode, and
   the wrapper is the only thing that knows which pane you are looking at. */
var MODES    = ['status', 'ledger', 'add'];
var frames   = {};                 // mode -> iframe
var loadedAt = {};                 // mode -> ms, for the staleness check
var active   = '';
var STALE_MS = 10 * 60 * 1000;     // a pane older than this reloads when shown

/* Parameters are read from the query string AND the fragment. Both, because
   some mobile paste targets percent-encode a "#" into the path, which is a 404
   on a static host: anything that must survive a bad paste has to work as "?".
   The token is the exception and stays out of the query string entirely. */
function readHash() {
  hash = {};
  function eat(s) {
    s.replace(/^[?#]/, '').split('&').forEach(function (kv) {
      var i = kv.indexOf('=');
      if (i > 0) hash[decodeURIComponent(kv.slice(0, i))] = decodeURIComponent(kv.slice(i + 1));
    });
  }
  eat(location.search);
  eat(location.hash);
  if (hash.banner !== undefined && +hash.banner >= 0) setBanner(+hash.banner);
}

function setBanner(n) {
  BANNER = Math.max(0, Math.min(200, n | 0));
  BANNER_SET = true;
  try { localStorage.setItem('llBanner', String(BANNER)); } catch (e) {}
}

/* The token is remembered on this origin after the first visit.
   It has to be: once installed, the manifest launches start_url "./" with NO
   fragment, so a fragment-only token would work exactly once and then the
   home screen icon would open to nothing.
   Storage can be empty or throw (private window, cleared data), so every
   access is guarded and the page falls back to asking for the token again. */
function loadToken() {
  readHash();
  if (hash.t !== undefined) {                       // fragment wins, and persists
    TOKEN = hash.t;
    try { TOKEN ? localStorage.setItem('llToken', TOKEN) : localStorage.removeItem('llToken'); }
    catch (e) {}
    return;
  }
  try { TOKEN = localStorage.getItem('llToken') || ''; } catch (e) { TOKEN = ''; }
}
loadToken();

function src(mode, prefetch) {
  return EXEC + '?t=' + encodeURIComponent(TOKEN)
       + (mode ? '&v=' + encodeURIComponent(mode) : '')
       + (prefetch ? '&pf=1' : '')                 // don't remember a preload
       + '&e=1';                                   // tells the app it is wrapped
}

function size() {
  var top = (-BANNER) + 'px', h = (window.innerHeight + BANNER) + 'px';
  for (var m in frames) { frames[m].style.top = top; frames[m].style.height = h; }
}

/* ------------------------------------------------------------------ panes */

function makePane(mode, prefetch) {
  var f = document.createElement('iframe');
  f.className = 'pane';
  f.title = 'Life Ledger';
  f.setAttribute('data-mode', mode);
  f.addEventListener('load', function () { loadedAt[mode] = Date.now(); });
  frames[mode] = f;
  clip.appendChild(f);
  size();
  f.src = src(mode, prefetch);
  return f;
}

function lastMode() {
  try { var m = localStorage.getItem('llMode'); if (m && MODES.indexOf(m) !== -1) return m; }
  catch (e) {}
  return 'status';
}

/* Switching is a visibility flip, not a page load, so it is instant. The one
   thing a kept-alive pane can get wrong is going stale, so a pane older than
   STALE_MS refetches as it is revealed. */
function showMode(mode) {
  if (MODES.indexOf(mode) === -1) return;
  var f = frames[mode] || makePane(mode, false);
  if (loadedAt[mode] && Date.now() - loadedAt[mode] > STALE_MS) {
    f.src = src(mode, false);
  }
  for (var m in frames) frames[m].classList.toggle('on', m === mode);
  active = mode;
  try { localStorage.setItem('llMode', mode); } catch (e) {}
}

/* The other two modes load quietly once the visible one has painted, one at a
   time so they do not compete with it for bandwidth. Each step is guarded: a
   frame that never fires 'load' must not stall the queue, and the timeout and
   the load event must not both advance it. */
function prefetchRest() {
  var rest = [];
  for (var i = 0; i < MODES.length; i++) if (MODES[i] !== active) rest.push(MODES[i]);
  (function next(i) {
    if (i >= rest.length) return;
    var moved = false;
    function go() { if (moved) return; moved = true; setTimeout(function () { next(i + 1); }, 400); }
    makePane(rest[i], true).addEventListener('load', go);
    setTimeout(go, 12000);
  })(0);
}

/* ?reset=1 forgets the stored token. It is a query string, not a fragment, on
   purpose: some mobile paste targets percent-encode a "#" into the path, which
   is a 404 on GitHub Pages. Everything here has to survive that. */
if (/[?&]reset=1\b/.test(location.search)) {
  try { localStorage.removeItem('llToken'); } catch (e) {}
  TOKEN = '';
}

function start() {
  if (!TOKEN) {
    document.getElementById('msg').classList.remove('hide');
    clip.classList.add('hide');
    setTimeout(function () { try { document.getElementById('tok').focus(); } catch (e) {} }, 60);
    return;
  }
  document.getElementById('msg').classList.add('hide');
  clip.classList.remove('hide');
  var want = (MODES.indexOf(hash.v) !== -1) ? hash.v : lastMode();
  if (!frames[want]) makePane(want, false);
  showMode(want);
  size();
  if (window.showTune) showTune(hash.tune === '1');
  /* Preloading is deliberately late. Holding it until the visible pane has
     finished means the mode you actually asked for never waits behind two you
     did not. */
  if (!prefetched) {
    prefetched = true;
    var f = frames[want], fired = false;
    function later() { if (!fired) { fired = true; setTimeout(prefetchRest, 800); } }
    f.addEventListener('load', later);
    setTimeout(later, 15000);
  }
}
var prefetched = false;

/* Typing the token beats putting it in the URL: no fragment to lose, no
   encoding to mangle, and it is entered once per device. */
document.getElementById('form').addEventListener('submit', function (ev) {
  ev.preventDefault();
  var el = document.getElementById('tok');
  var v  = String(el.value || '').trim().replace(/^#?t=/, '');   // tolerate a pasted "#t=..."
  var err = document.getElementById('err');
  if (!v) { err.textContent = 'Paste the token first.'; return; }
  if (!/^[A-Za-z0-9_-]{16,}$/.test(v)) {
    err.textContent = 'That does not look like the token. It is one long run of letters and numbers.';
    return;
  }
  err.textContent = '';
  TOKEN = v;
  try { localStorage.setItem('llToken', TOKEN); } catch (e) {}
  start();
});

/* The tuner adjusts the crop live. Nothing reloads, so the app keeps its state
   while you nudge the number: what you see is what the installed app will use.

   It opens BY ITSELF the first time this device shows the app, because the
   banner is not the same height everywhere and the alternative was asking
   someone to hand-edit a URL on a phone. Once a value is saved it never
   appears again unless ?tune=1 asks for it. */
(function () {
  var bar = document.getElementById('tune'), val = document.getElementById('tval');
  function show() { val.textContent = BANNER; }
  window.showTune = function (force) {
    if (!force && BANNER_SET) return;
    bar.classList.remove('hide');
    show();
  };
  bar.addEventListener('click', function (ev) {
    var t = ev.target;
    if (t.id === 'done') {
      /* Persist even if nothing was nudged, so the tuner does not reappear on
         every launch for someone whose banner really is the default height.
         Then drop every parameter and land on the URL the home screen icon
         uses, so what was just tuned is what a real launch will look like. */
      setBanner(BANNER);
      location.href = location.pathname;
      return;
    }
    var d = t.getAttribute && t.getAttribute('data-d');
    if (!d) return;
    setBanner(BANNER + (+d));
    show(); size();
  });
})();

addEventListener('resize', size);
addEventListener('orientationchange', function () { setTimeout(size, 150); });
/* Changing the fragment does not reload the page, so re-read it by hand.
   This is how you swap in a rotated token without clearing site data. */
addEventListener('hashchange', function () { loadToken(); start(); });
start();

/* The app's mode buttons post up here instead of navigating, because a normal
   link with target=_top would replace THIS page with script.google.com and the
   banner would be right back. Only messages from Google's own origins are
   accepted, and only the three known mode names.

   The app runs two frames down (wrapper > script.google.com > googleusercontent
   sandbox), so e.source identity cannot be used; a grandchild's window is not
   frame.contentWindow. Falling back to an origin allowlist plus a strict shape
   check, and the payload can only ever name one of three modes. */
function trusted(origin) {
  if (origin === location.origin) return true;                   // our own page
  return /^https:\/\/([a-z0-9-]+\.)*(google|googleusercontent)\.com$/.test(origin);
}

addEventListener('message', function (e) {
  if (!trusted(e.origin)) return;
  var d = e.data;
  if (!d || d.app !== 'lifeledger' || MODES.indexOf(d.v) === -1) return;
  showMode(d.v);
});
</script>
</body>
</html>
